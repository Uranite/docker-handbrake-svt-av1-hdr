name: Update SVT-AV1-HDR

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch, tag, or commit (default: main)'
        required: false
        default: main
        type: string

concurrency:
  group: update-svt-av1-hdr
  cancel-in-progress: false

# The SVT-AV1-HDR tarball is built and published by this repository, so the
# image build never depends on another repository's release assets.
env:
  RELEASE_REPO: Uranite/docker-handbrake-svt-av1-hdr
  RELEASE_TAG: contribs

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Update pin to latest upstream commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update SVT-AV1-HDR
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ inputs.ref || 'main' }}
        run: bash scripts/update-svt-av1-hdr.sh

      - name: Commit and push
        id: commit
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/handbrake/patches/0004-change-repo-url.patch
          git commit -m "Update SVT-AV1-HDR to ${{ steps.update.outputs.version }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not start workflow runs, so start the
      # image build explicitly after the new pin is committed.
      - name: Trigger image build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-image.yml --ref master
